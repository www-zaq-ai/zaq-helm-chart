# Resource names. Empty overrides use the chart/release names.
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
# Recreate avoids overlapping writers and ReadWriteOnce attachment conflicts.
strategy:
  type: Recreate
image:
  repository: ghcr.io/www-zaq-ai/zaq
  tag: v0.19.0
  # Optional immutable digest. A nonempty digest takes precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent
  # Required with a digest or a non-semantic tag; operator-attested image version.
  appVersion: ""
  # Operator attestation: selected image includes ZAQ PR #943 (application TLS).
  # Published v0.19.0 and earlier do not. Required when database.tls.enabled.
  databaseTlsSupported: false
imagePullSecrets: []
secrets:
  # Existing Secret in the release namespace; no credentials in Helm values.
  existingSecret: zaq-runtime
  keys:
    ownerPassword: owner-password
    readerPassword: reader-password
    secretKeyBase: secret-key-base
    encryptionKey: encryption-key
database:
  tls:
    # Compatibility default for the published image. Enable for a TLS-capable
    # image; true means verified application TLS, with no plaintext fallback.
    enabled: false
    ca:
      # Optional shared CA bundle, never credential contents. Empty uses system
      # trust. May be the same Secret as database.provisioning.existingSecret.
      existingSecret: ""
      key: ca.crt
  host: postgresql
  port: 5432
  # Empty identities derive from namespace/release plus a hash. Keep stable.
  name: ""
  owner: ""
  reader: ""
  poolSize: 10
  ipv6: false
  provisioning:
    enabled: true
    existingSecret: zaq-dba
    keys:
      username: username
      password: password
    maintenanceDatabase: postgres
    engine: auto
    # Independent libpq setting for provisioning ONLY. Use verify-full for
    # verified DBA/reader connections; application TLS never overrides this.
    sslMode: prefer
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: false
app:
  host: zaq.example.com
  encryptionKeyId: v1
  workflowsEnabled: true
  # Non-sensitive string values only; exposed as a key/value map in Rancher.
  # Application container only. Chart-managed/bootstrap settings are reserved.
  extraEnv: {}
  # Sensitive settings: individual existing Secret keys in the release namespace.
  # Example: [{name: MY_API_TOKEN, secretKeyRef: {name: integration-secrets, key: api-token}}]
  extraEnvSecrets: []
# Optional read-only prerequisite hook. Never provisions or runs ZAQ/migrations.
preflight:
  enabled: false
  # Bounds even Pods that cannot start because a Secret/key is missing.
  activeDeadlineSeconds: 120
  connectTimeoutSeconds: 10
  # Successful hooks are removed immediately; failed hooks expire via Job TTL.
  ttlSecondsAfterFinished: 3600
  # Independent libpq mode for this check ONLY. Supports verify-ca/verify-full;
  # shares database.tls.ca if selected, otherwise verification uses system trust.
  sslMode: prefer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
serviceAccount:
  create: true
  name: ""
  annotations: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  # A supplemental group gives volume write access without assuming image GID.
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  # ZAQ/browser tooling writes under /app; validate before enabling read-only.
  readOnlyRootFilesystem: false
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi
persistence:
  enabled: true
  existingClaim: ""
  # null: cluster default; "": explicitly no class; otherwise existing class name.
  storageClass: null
  accessModes: [ReadWriteOnce]
  size: 10Gi
  retain: true
  annotations: {}
service:
  port: 4000
ingress:
  enabled: false
  className: ""
  # Editable in Rancher; additional annotations are merged with these defaults.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50M"
    nginx.org/client-max-body-size: "50M"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: zaq.example.com
  path: /
  pathType: Prefix
  # Simple single-host TLS configuration, also exposed in Rancher's form.
  # The Secret may already exist or be created externally by cert-manager.
  tlsEnabled: false
  tlsSecretName: ""
  # Advanced alternative: leave tlsEnabled=false when supplying this list.
  # Example: [{secretName: zaq-tls, hosts: [zaq.example.com]}]
  tls: []
probes:
  startup:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 90
  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
terminationGracePeriodSeconds: 60
nodeSelector: {}
tolerations: []
affinity: {}
