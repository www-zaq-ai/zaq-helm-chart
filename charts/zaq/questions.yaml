categories:
  - AI
  - Collaboration
questions:
  - variable: database.host
    default: postgresql
    type: string
    required: true
    label: PostgreSQL host
    description: Reachable DNS name or IPv4 address, including an external or cross-namespace endpoint; no local PostgreSQL workload is required.
    group: Database
  - variable: database.port
    default: 5432
    type: int
    min: 1
    max: 65535
    required: true
    label: PostgreSQL port
    group: Database
  - variable: database.name
    default: ""
    type: string
    label: Target database name
    description: Empty derives a release/namespace-specific name. Set stable explicit identities in production.
    group: Database
  - variable: database.owner
    default: ""
    type: string
    label: Application-owner login name
    description: Empty derives a unique login name. ZAQ v0.19.1 and later require cluster-wide CREATEROLE for this owner; it is not confined to this database. This is a username, never a password.
    group: Database
  - variable: database.reader
    default: ""
    type: string
    label: Reader login name
    show_if: database.provisioning.enabled=true
    group: Database
  - variable: database.provisioning.enabled
    default: true
    type: boolean
    label: Provision the database and owner/reader logins
    description: Requires a superuser DBA. ZAQ v0.19.1 and later grant the owner cluster-wide CREATEROLE, not the reader. Existing v0.18.0 deployments need reviewed external DBA maintenance before upgrading. Disable for a DBA-prepared database; no PostgreSQL server is installed by this chart.
    group: Database
  - variable: database.provisioning.existingSecret
    default: zaq-dba
    type: secret
    required: true
    label: Existing DBA Secret name
    description: Select a pre-existing Secret in this namespace. DBA credentials are not passed to ZAQ.
    show_if: database.provisioning.enabled=true
    group: Database
  - variable: database.provisioning.keys.username
    default: username
    type: string
    required: true
    label: DBA username key name
    show_if: database.provisioning.enabled=true
    group: Database
  - variable: database.provisioning.keys.password
    default: password
    type: string
    required: true
    label: DBA password key name (not its value)
    show_if: database.provisioning.enabled=true
    group: Database
  - variable: database.provisioning.maintenanceDatabase
    default: postgres
    type: string
    required: true
    label: DBA maintenance database
    show_if: database.provisioning.enabled=true
    group: Database
  - variable: database.provisioning.engine
    default: auto
    type: enum
    options: [auto, postgres, paradedb]
    required: true
    label: Database engine capability selection
    show_if: database.provisioning.enabled=true
    group: Database
  - variable: secrets.existingSecret
    default: zaq-runtime
    type: secret
    required: true
    label: Existing deployment Secret name
    description: Create it externally first. It holds owner/reader passwords, Phoenix key and configuration encryption key. Never enter their values here.
    group: Secret references
  - variable: secrets.keys.ownerPassword
    default: owner-password
    type: string
    required: true
    label: Owner password key name (not its value)
    group: Secret references
  - variable: secrets.keys.readerPassword
    default: reader-password
    type: string
    required: true
    label: Reader password key name (not its value)
    show_if: database.provisioning.enabled=true
    group: Secret references
  - variable: secrets.keys.secretKeyBase
    default: secret-key-base
    type: string
    required: true
    label: Phoenix key name (not its value)
    group: Secret references
  - variable: secrets.keys.encryptionKey
    default: encryption-key
    type: string
    required: true
    label: Configuration encryption key name (not its value)
    group: Secret references
  - variable: preflight.enabled
    default: false
    type: boolean
    label: Run prerequisite preflight before install/upgrade
    description: Bounded read-only connectivity/authentication check plus required Secret key references. It does not provision, migrate or validate application keys.
    group: Prerequisite check
  - variable: preflight.activeDeadlineSeconds
    default: 120
    type: int
    min: 15
    max: 600
    required: true
    label: Job deadline (seconds)
    description: Includes scheduling, image pulls and missing-Secret/key waits; allow enough time on cold nodes.
    show_if: preflight.enabled=true
    group: Prerequisite check
  - variable: preflight.connectTimeoutSeconds
    default: 10
    type: int
    min: 1
    max: 30
    required: true
    label: Connection/query timeout (seconds)
    description: Must be shorter than the Job deadline.
    show_if: preflight.enabled=true
    group: Prerequisite check
  - variable: persistence.enabled
    default: true
    type: boolean
    label: Persistent application storage
    description: Disabling uses emptyDir; Pod deletion loses application files.
    group: Storage
  - variable: persistence.existingClaim
    default: ""
    type: pvc
    label: Existing PVC name (optional)
    description: Select a claim in this namespace, or leave empty to create one. When reusing a PVC, leave storageClass null/unset in Values YAML.
    show_if: persistence.enabled=true
    group: Storage
  - variable: persistence.storageClass
    default: null
    type: storageclass
    label: Existing StorageClass (optional)
    description: Null/unset uses the cluster default; an empty string explicitly means no class. Clear this to null in Values YAML when reusing a PVC.
    show_if: persistence.enabled=true&&persistence.existingClaim=
    group: Storage
  - variable: persistence.size
    default: 10Gi
    type: string
    required: true
    label: New PVC size
    show_if: persistence.enabled=true&&persistence.existingClaim=
    group: Storage
  - variable: persistence.accessModes
    default: [ReadWriteOnce]
    type: array[string]
    label: PVC access modes
    show_if: persistence.enabled=true
    group: Storage
  - variable: persistence.retain
    default: true
    type: boolean
    label: Retain chart-created PVC on uninstall
    show_if: persistence.enabled=true&&persistence.existingClaim=
    group: Storage
  - variable: app.host
    default: zaq.example.com
    type: hostname
    required: true
    label: Public ZAQ hostname
    description: Must match the Ingress hostname if Ingress is enabled. Restrict access until the initial administrator password has been changed.
    group: Networking
  - variable: app.extraEnv
    default: {}
    type: map[string]
    label: Additional application environment variables
    description: Non-sensitive string values only, for example REQ_LLM_POOL_SIZE=50. Never enter passwords, tokens or keys; use app.extraEnvSecrets in Values YAML for existing Secret-key references. Reserved chart/bootstrap names are rejected. Changes roll out the application Pod, not the provisioning/preflight containers.
    group: Application
  - variable: ingress.enabled
    default: false
    type: boolean
    label: Enable Ingress
    description: Creates an Ingress pointing to the internal ClusterIP Service. An Ingress controller and DNS must be configured separately.
    group: Networking
  - variable: ingress.host
    default: zaq.example.com
    type: hostname
    required: true
    label: Ingress hostname
    description: Must equal app.host.
    show_if: ingress.enabled=true
    group: Networking
  - variable: ingress.className
    default: ""
    type: string
    label: Ingress class name
    show_if: ingress.enabled=true
    group: Networking
  - variable: ingress.annotations
    default:
      nginx.ingress.kubernetes.io/proxy-body-size: "50M"
      nginx.org/client-max-body-size: "50M"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    type: map[string]
    label: Ingress annotations
    description: "Editable NGINX defaults: 50M body size and 3600-second ingress-nginx read/send timeouts. Add more key/value settings, for example cert-manager.io/cluster-issuer: letsencrypt-prod. Automatic certificates require installed cert-manager and a configured issuer."
    show_if: ingress.enabled=true
    group: Networking
  - variable: ingress.tlsEnabled
    default: false
    type: boolean
    label: Enable TLS
    description: Uses the Ingress hostname for TLS. Does not generate certificates; use an existing TLS Secret or external cert-manager. Leave off when configuring the advanced ingress.tls list in Values YAML.
    show_if: ingress.enabled=true
    group: Networking
  - variable: ingress.tlsSecretName
    default: ""
    type: string
    required: true
    label: TLS Secret name
    description: Name in this namespace of an existing TLS Secret or one cert-manager will create. Enter a name only, never certificate/private-key values. Clear the advanced ingress.tls list when enabling this option.
    show_if: ingress.enabled=true&&ingress.tlsEnabled=true
    group: Networking
  - variable: database.tls.enabled
    default: false
    type: boolean
    label: Enable database TLS
    description: One switch for application, provisioning and preflight. Enabled means verified application TLS without plaintext fallback; disabled means plaintext for every client. Official ZAQ images support TLS starting at v0.19.1.
    group: Database TLS
  - variable: database.tls.libpqMode
    default: verify-full
    type: enum
    options: [require, verify-ca, verify-full]
    label: Provisioning and preflight TLS mode
    description: Shared libpq mode when TLS is enabled. verify-full validates certificate chain and hostname (recommended); verify-ca validates only the chain; require enforces encryption without guaranteeing hostname verification. Application TLS always validates both chain and hostname. Ignored when TLS is disabled.
    show_if: database.tls.enabled=true
    group: Database TLS
  - variable: database.tls.ca.existingSecret
    default: ""
    type: secret
    label: Existing database CA Secret (optional)
    description: Empty uses system trust for certificate verification. May select the existing DBA Secret; only the selected CA key is mounted, never its credential keys. Shared by application, provisioning and preflight; ignored when TLS is disabled.
    show_if: database.tls.enabled=true
    group: Database TLS
  - variable: database.tls.ca.key
    default: ca.crt
    type: string
    required: true
    label: CA bundle key name
    description: Key containing a PEM CA bundle in the selected Secret, not a private key or credential value. Used only when a CA Secret is selected.
    show_if: database.tls.enabled=true
    group: Database TLS
