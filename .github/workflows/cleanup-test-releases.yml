name: Clean up test releases
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletion without changing artifacts
        type: boolean
        default: true
  workflow_call:
    inputs:
      dry_run:
        description: Preview deletion without changing artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cleanup:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    concurrency:
      group: chart-test-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Install dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/zaq-venv"
          "$RUNNER_TEMP/zaq-venv/bin/pip" install -r tests/requirements.txt
      - name: Keep newest three and delete other test artifacts older than seven days
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_APPLY: ${{ !inputs.dry_run }}
        run: |
          args=()
          if [[ "$CLEANUP_APPLY" == true ]]; then args+=(--apply); fi
          "$RUNNER_TEMP/zaq-venv/bin/python" tests/prerelease.py cleanup "${args[@]}"
