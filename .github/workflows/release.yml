name: Release chart
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: chart-release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['charts/zaq--release_created'] }}
      tag_name: ${{ steps.release.outputs['charts/zaq--tag_name'] }}
      sha: ${{ steps.release.outputs['charts/zaq--sha'] }}
    steps:
      - name: Create or update chart release PR, or release a merged PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  validate:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Install pinned tools and dependencies
        run: |
          INSTALL_DIR="$RUNNER_TEMP/zaq-tools" bash tests/install-tools.sh
          echo "$RUNNER_TEMP/zaq-tools" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/zaq-venv"
          "$RUNNER_TEMP/zaq-venv/bin/pip" install -r tests/requirements.txt
      - name: Validate release tag and chart
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          "$RUNNER_TEMP/zaq-venv/bin/python" tests/release.py check-tag
          "$RUNNER_TEMP/zaq-venv/bin/python" tests/validate.py
          npx --yes markdownlint-cli2@0.18.1 README.md AGENTS.md docs/*.md charts/zaq/README.md
  install:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Install pinned tools and dependencies
        run: |
          INSTALL_DIR="$RUNNER_TEMP/zaq-tools" bash tests/install-tools.sh
          echo "$RUNNER_TEMP/zaq-tools" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/zaq-venv"
          "$RUNNER_TEMP/zaq-venv/bin/pip" install -r tests/requirements.txt
      - name: Real installation gate
        run: '"$RUNNER_TEMP/zaq-venv/bin/python" -u tests/integration.py'
  publish:
    needs: [release, validate, install]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Install pinned tools and dependencies
        run: |
          INSTALL_DIR="$RUNNER_TEMP/zaq-tools" bash tests/install-tools.sh
          echo "$RUNNER_TEMP/zaq-tools" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/zaq-venv"
          "$RUNNER_TEMP/zaq-venv/bin/pip" install -r tests/requirements.txt
      - name: Refuse existing versions and publish OCI chart
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$RUNNER_TEMP/zaq-venv/bin/python" tests/release.py publish'
