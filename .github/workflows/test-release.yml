name: Test release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Install dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/zaq-venv"
          "$RUNNER_TEMP/zaq-venv/bin/pip" install -r tests/requirements.txt
      - name: Resolve current main and unique test version
        id: candidate
        run: '"$RUNNER_TEMP/zaq-venv/bin/python" tests/prerelease.py prepare'
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install pinned tools and dependencies
        run: |
          INSTALL_DIR="$RUNNER_TEMP/zaq-tools" bash tests/install-tools.sh
          echo "$RUNNER_TEMP/zaq-tools" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/zaq-venv"
          "$RUNNER_TEMP/zaq-venv/bin/pip" install -r tests/requirements.txt
      - name: Validate source and packaged test version
        shell: bash
        env:
          TEST_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          "$RUNNER_TEMP/zaq-venv/bin/python" tests/validate.py
          npx --yes markdownlint-cli2@0.18.1 README.md AGENTS.md docs/*.md charts/zaq/README.md
          helm package charts/zaq --version "$TEST_VERSION" --destination "$RUNNER_TEMP/packages"
          helm lint --strict "$RUNNER_TEMP/packages/zaq-$TEST_VERSION.tgz"
          helm template test "$RUNNER_TEMP/packages/zaq-$TEST_VERSION.tgz" --kube-version 1.34.0 |
            kubeconform -strict -summary -kubernetes-version 1.34.0
  install:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install pinned tools and dependencies
        run: |
          INSTALL_DIR="$RUNNER_TEMP/zaq-tools" bash tests/install-tools.sh
          echo "$RUNNER_TEMP/zaq-tools" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/zaq-venv"
          "$RUNNER_TEMP/zaq-venv/bin/pip" install -r tests/requirements.txt
      - name: Test the packaged prerelease with real ZAQ in Kind
        env:
          TEST_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          helm package charts/zaq --version "$TEST_VERSION" --destination "$RUNNER_TEMP/packages"
          export ZAQ_CHART_PATH="$RUNNER_TEMP/packages/zaq-$TEST_VERSION.tgz"
          "$RUNNER_TEMP/zaq-venv/bin/python" -u tests/integration.py
  publish:
    needs: [prepare, validate, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    concurrency:
      group: chart-test-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install pinned tools and dependencies
        run: |
          INSTALL_DIR="$RUNNER_TEMP/zaq-tools" bash tests/install-tools.sh
          echo "$RUNNER_TEMP/zaq-tools" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/zaq-venv"
          "$RUNNER_TEMP/zaq-venv/bin/pip" install -r tests/requirements.txt
      - name: Publish isolated OCI chart and GitHub prerelease
        env:
          TEST_VERSION: ${{ needs.prepare.outputs.version }}
          TEST_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$RUNNER_TEMP/zaq-venv/bin/python" tests/prerelease.py publish'
  cleanup:
    needs: publish
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/cleanup-test-releases.yml
    with:
      dry_run: false
